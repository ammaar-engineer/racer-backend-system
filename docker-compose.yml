services:
  MinIO:
    image: minio/minio
    container_name: "minio-container"
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console (Web UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      GOMAXPROCS: "1"
      MINIO_STORAGE_CLASS_STANDARD: "EC:0"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M

  # Set policy otomatis
